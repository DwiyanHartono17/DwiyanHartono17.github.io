<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting… | M. Dwiyan Hartono</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages SPA fallback (https://github.com/rafgraph/spa-github-pages).
      // Serves index.html for deep links so client-side routing still works.
      (function () {
        var segmentCount = 0
        var location = window.location
        var l = location
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + segmentCount)
              .join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(segmentCount)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body>
    <p style="font-family: sans-serif; padding: 2rem">
      Redirecting… If you are not redirected automatically,
      <a href="/">click here to go to the homepage</a>.
    </p>
  </body>
</html>
